# Build and check every game on each pull request; on main, also deploy the site to Cloudflare.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the game list shows each game's last-change date from git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site (engine + every game)
        run: npm run build
      - name: Unit tests (build, editor patches, Access check)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0 pillow numpy
          python -m playwright install --with-deps chromium
      - name: Smoke-test every game in both renderers
        run: python3 tests/smoke.py --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots/
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to glyphite.hornbaek.org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM_DOMAIN: ${{ vars.TEAM_DOMAIN }}
          POLICY_AUD: ${{ vars.POLICY_AUD }}
          ALLOWED_EMAIL: ${{ vars.ALLOWED_EMAIL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret: skipping the deploy. See docs/DEPLOY.md."
            exit 0
          fi
          # Access settings come from repository variables when set; otherwise the values already on
          # the Worker are kept (wrangler.jsonc has keep_vars).
          args=()
          for v in TEAM_DOMAIN POLICY_AUD ALLOWED_EMAIL; do
            if [ -n "${!v}" ]; then args+=(--var "$v:${!v}"); fi
          done
          npx wrangler deploy "${args[@]}"
